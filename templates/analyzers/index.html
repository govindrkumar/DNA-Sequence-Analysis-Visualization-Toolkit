{% extends 'base.html' %}
{% load static %}


{% block title %}Biseq Analyzer{% endblock %}

{% block content %}
    <div class="main-content">
        <section class="h1">
            <h1>Analysis of DNA Sequence</h1><br>
        </section>

        <section class="h2">
            <h2>We support .fasta and .gb file.</h2><br>
        </section>

        <section class="h3">
            <h3>
                <a class="analysis-button" href="{% url 'analyse_page' %}">
                    Run Analysis →
                </a>
            </h3>
        </section>

        <style>
            .main-content {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                margin-right: 50px;
                margin-top: 300px;
            
            }


            .analysis-button {
                display: inline-block;
                border: 2px solid black;
                background-color: rgb(235, 235, 92);
                padding: 10px;
                text-decoration: none;
                transition: transform 0.2s ease-in-out;
            }

            .analysis-button:hover {
                transform: scale(1.1);
            }
        </style>
    </div>
     



{% endblock %}
